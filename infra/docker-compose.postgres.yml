name: meta-ads-copilot

services:
  postgres:
    image: postgres:17.10-alpine3.24
    container_name: meta-ads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meta_ads_copilot
      POSTGRES_USER: meta_ads_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
    secrets:
      - postgres_password
    volumes:
      - /opt/meta-ads-copilot-runtime/postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meta_ads_owner -d meta_ads_copilot"]
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 256mb

secrets:
  postgres_password:
    file: /etc/meta-ads-copilot/postgres-password
