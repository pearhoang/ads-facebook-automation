[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads-copilot"
version = "0.1.0"
description = "SaaS control plane and browser workers for Meta Ads automation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "websockets>=13,<18",
  "cryptography>=44,<50",
  "pyyaml>=6,<7",
  "paramiko>=3.5,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["backend*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
