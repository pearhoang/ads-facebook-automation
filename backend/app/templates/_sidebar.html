  </a>

    <div class="sidebar-section">Điều hướng</div>
    <a class="nav-item nav-link{% if active_nav == 'accounts' %} is-active active-nav{% endif %}" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>

  <footer class="sidebar-footer">
    <button class="sidebar-account-button" type="button" data-account-menu-toggle aria-expanded="false" aria-controls="sidebar-account-menu">

      <span class="sidebar-account-copy"><strong>Admin</strong><span>Tài khoản</span></span>

    <div id="sidebar-account-menu" class="sidebar-account-menu" hidden>
      <button type="button" data-open-password-dialog>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M15 8l2 2M17 6l2 2"/></svg>
        Đổi mật khẩu
      </button>
      <button id="logout-button" type="button" data-global-logout>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>

    </div>
