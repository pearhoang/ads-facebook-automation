<dialog id="password-dialog" class="password-dialog" aria-labelledby="password-dialog-title">
  <form id="password-form" method="dialog">
    <div class="dialog-header">
      <div>
        <h2 id="password-dialog-title">Đổi mật khẩu</h2>
        <p>Cập nhật mật khẩu đăng nhập control-plane của {{ principal.email }}.</p>
      </div>
      <button class="icon-button" type="button" data-close-password-dialog aria-label="Đóng">×</button>
    </div>
    <label>Mật khẩu hiện tại
      <input id="current-password" type="password" required maxlength="1024" autocomplete="current-password">
    </label>
    <label>Mật khẩu mới
      <input id="new-password" type="password" required minlength="4" maxlength="1024" autocomplete="new-password">
    </label>
    <label>Xác nhận mật khẩu mới
      <input id="new-password-confirmation" type="password" required minlength="4" maxlength="1024" autocomplete="new-password">
    </label>
    <p class="inline-help">Mật khẩu mới cần ít nhất 4 ký tự. Sau khi đổi, các phiên đăng nhập khác của tài khoản này sẽ bị đăng xuất.</p>
    <div id="password-status" class="password-status" role="status" aria-live="polite" hidden></div>
    <div class="dialog-actions">
      <button class="button button-secondary" type="button" data-close-password-dialog>Hủy</button>
      <button id="password-submit" class="button button-primary" type="submit">Đổi mật khẩu</button>
    </div>
  </form>
</dialog>
